{% extends 'base_apps.html' %}
 
{% block title %}Detalle del Club{% endblock %}

{% block contenido_apps %}
<div class="card shadow-sm border-0 rounded-3">
    <!-- Encabezado de la Tarjeta -->
    <div class="card-header bg-primary text-white p-3 d-flex justify-content-between align-items-center rounded-top-3">
        <h5 class="card-title mb-0 fw-bold">
            <i class="bi bi-trophy-fill me-2"></i>{{ disciplina.nombre|upper }}
        </h5>
        
    </div>

    <!-- Cuerpo de la Tarjeta -->
    <div class="card-body p-4">
        <div class="mb-3">
            <h6 class="text-muted text-uppercase fw-semibold mb-2" style="font-size: 0.85rem;">Descripción</h6>
            <p class="text-dark mb-0 lh-base">
                <!-- El filtro linebreaksbr respeta los saltos de línea que el usuario escriba en el TextField -->
                <strong>{{ disciplina.descripcion|linebreaksbr }}</strong>
            </p>
        </div>
    </div>


</div>
            
            {% include "includes/boton_volver.html" with url_name=url_volver boton_titulo='Volver' %}  

{% endblock %}
