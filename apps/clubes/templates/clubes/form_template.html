{% extends 'base_apps.html' %}
{% load crispy_forms_tags %}

{% block title %}
    {{titulo|upper}}
{% endblock %} 

{% block contenido_apps %}     
    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body">
            <!-- Título dinámico según si es creación o edición -->
            <h6 class="mb-4">
                {{titulo|upper}}
                <hr>
            </h6>
            <form method="POST"> 
                {% csrf_token %}
                {% crispy form %}
            </form>
            
        </div>
    </div>
    {% include "includes/boton_volver.html" with url_name=url_volver boton_titulo='Volver' %}  
{% endblock %}
