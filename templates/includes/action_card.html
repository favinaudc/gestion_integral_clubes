<div class="col-lg-4 col-md-6 col-12">
    <a href="{% url url_name %}" class="card action-card p-3 shadow-sm h-100 text-start">
        <div class="card-body d-flex align-items-center p-0">
            
            <div class="icon-wrapper bg-{{ color_theme|default:'primary' }} bg-opacity-10 me-3">
                <i class="{{ icon_class }} text-{{ color_theme|default:'primary' }} fs-4"></i>
            </div>
            
            <div>
                <h6 class="fw-bold text-uppercase mb-1">{{ titulo }}</h6>
                <p class="text-secondary mb-0" style="font-size: 0.8rem;">{{ descripcion }}</p>
            </div>
            
        </div>
    </a>
</div>
