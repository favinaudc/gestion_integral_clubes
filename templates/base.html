{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestión de Clubes{% endblock %}</title>

     <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome (reemplaza Bootstrap Icons para darle el toque premium) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap-utilities.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap-reboot.min.css' %}">
    
    {% block base_extra_css %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Navegación (opcional) -->
 

    <!-- Contenido Principal -->
    <main class="flex-grow-1">
        <div>
            {% block contenido_principal %}{% endblock %}
        </div>
    </main>

    <!-- Footer (opcional) -->
    <footer class="text-center py-4 mt-5">
        <p class="mb-0">Trabajo Integrador · Programación Web II · 2026</p>
    </footer>

    <!-- Bootstrap JS Bundle (incluye Popper) -->
    <script src="{% static 'js/jquery-3.6.0.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
