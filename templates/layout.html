<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Gestión de Clubes</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 p-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <!-- Tarjeta Principal de Bienvenida -->
                <div class="card border-0 shadow-sm rounded-4 text-center p-4 p-md-5 bg-white">
                    <div class="card-body">
                        
                        <!-- Badge/Insignia superior -->
                        <span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-3 py-2 mb-3">
                            Plataforma de Gestión Deportiva
                        </span>

                        <h1 class="h2 fw-bold mb-3 text-dark">Bienvenido al Sistema</h1>
                        
                        <p class="text-secondary mb-4">
                            Administración centralizada de instituciones deportivas, disciplinas y seguimiento de categorías por edades.
                        </p>

                        <!-- Botón de Acción Principal -->
                        <div class="d-grid gap-2 col-sm-8 mx-auto">
                            <a href="{% url 'clubes:clubes_listado' %}" class="btn btn-primary btn-lg shadow-sm">
                                Ver Clubes Registrados
                            </a>
                        </div>

                    </div>
                    
                    <!-- Pie sutil -->
                    <div class="card-footer bg-transparent border-0 text-muted small mt-3">
                        Trabajo Integrador · Programación Web II
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- JS de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
